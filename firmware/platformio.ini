; Optional: build with PlatformIO instead of idf.py.
;   pio run                 build
;   pio run -t upload       flash (board in DFU/boot mode over USB)
[platformio]
src_dir = main

[env:flipper_wifi_devboard]
; Pinned for reproducible builds. This is PlatformIO's espressif32 platform
; version, not ESP-IDF's: platform 8.0.0 ships framework-espidf 4.60100.0,
; which is ESP-IDF 6.1.0.
platform = espressif32@8.0.0
framework = espidf
board = esp32-s2-saola-1
board_build.flash_size = 4MB
monitor_speed = 115200
; Re-run CMake when `git describe` changes, so INFO's Commit isn't stale.
extra_scripts = pre:git_version.py
