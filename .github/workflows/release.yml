# Build the Flipper app (with oui.db) and the board firmware.
#
# - push to any branch: build + package as a CI check, skipped when the push
#   only touches files the build doesn't read (docs, screenshots, catalog
#   metadata, the other workflow). Runs can restore caches
#   saved on their own branch or on the default branch (main); tag runs only the
#   default branch's, so the large toolchain caches (ufbt, PlatformIO) are saved
#   there only.
# - v<fap_version> tag: build, package and publish the GitHub release.
# - workflow_dispatch: same files as a build artifact, no release.
name: Build and release

on:
  push:
    branches: ["**"]
    tags: ["v*"]   # path filters don't apply to tag pushes: releases always build
    # Later patterns win. Markdown the packaging reads (THIRD_PARTY_NOTICES.md,
    # catalog/changelog.md) still triggers; so does LICENSE / licenses/.
    paths:
      - "**"
      - "!**/*.md"
      - "!docs/**"
      - "!flipper_app/catalog/**"
      - "!.github/dependabot.yml"
      - "!.github/workflows/toolchain-check.yml"
      - "!.gitignore"
      - "THIRD_PARTY_NOTICES.md"
      - "flipper_app/catalog/changelog.md"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  # Feature branches auto-cancel a stale in-progress build (newest push wins).
  # The default branch and tags never cancel: same-ref runs serialize instead,
  # so back-to-back main pushes both finish (a release's commit_sha follow-up
  # only touches the catalog manifest, so it doesn't build at all).
  cancel-in-progress: ${{ github.ref_type != 'tag' && github.ref != format('refs/heads/{0}', github.event.repository.default_branch) }}

env:
  FLIPPER_SDK: "1.5.1"   # firmware SDK the app is built against (API 88.2)
  SAVE_TOOLCHAINS: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}

jobs:
  build:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      # PlatformIO builds ESP-IDF's Python env from this one. Not 3.15 yet: its
      # pydantic-core has no 3.15 wheel and can't build from source (PyO3 <= 3.14).
      # The pip cache is keyed on the ufbt/PlatformIO pins in .github/ci/requirements.txt.
      - uses: actions/setup-python@v7
        id: python
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: .github/ci/requirements.txt

      - name: Check tag matches fap_version
        if: github.ref_type == 'tag'
        run: |
          ver=$(sed -nE 's/^\s*fap_version="([^"]+)".*/\1/p' flipper_app/application.fam)
          if [ "v$ver" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match fap_version $ver"
            exit 1
          fi

      # The vendor db and the Wireshark manuf it's built from are committed (the
      # catalog builds from the tree as-is); make sure they still match.
      - name: Check oui.db matches tools/manuf.gz
        run: python3 tools/gen_oui.py tools/manuf.gz --check flipper_app/assets/oui.db

      - name: Install ufbt and PlatformIO
        run: pip install -r .github/ci/requirements.txt

      # The two toolchains are cached separately, each keyed on its own pins, so
      # bumping one doesn't throw away the other:
      # - ufbt (~/.ufbt: ARM toolchain + SDK) on FLIPPER_SDK. ufbt brings its own
      #   Python, so the runner's doesn't matter.
      # - PlatformIO (~/.platformio) on the exact Python version (ESP-IDF's env in
      #   there is tied to it) and only the platform / platform_packages pins from
      #   platformio.ini, so other edits there don't throw the cache away.
      - name: Cache keys
        id: keys
        run: |
          echo "ufbt=ufbt-${{ runner.os }}-$FLIPPER_SDK" >> "$GITHUB_OUTPUT"
          pio=$(sed -nE 's/^(platform|platform_packages) *= *//p' firmware/platformio.ini | tr -s ' \n' '+' | sed 's/+$//')
          echo "pio=pio-${{ runner.os }}-py${{ steps.python.outputs.python-version }}-$pio" >> "$GITHUB_OUTPUT"
          # Artifact names can't contain '/', which branch names like claude/x do.
          echo "artifact=wavehound-${GITHUB_REF_NAME//\//-}" >> "$GITHUB_OUTPUT"

      - uses: actions/cache/restore@v6
        id: ufbt
        with:
          path: ~/.ufbt
          key: ${{ steps.keys.outputs.ufbt }}

      - uses: actions/cache/restore@v6
        id: pio
        with:
          path: ~/.platformio
          key: ${{ steps.keys.outputs.pio }}

      - name: Build Flipper app
        run: |
          ufbt update --hw-target f7 --url "https://update.flipperzero.one/builds/firmware/$FLIPPER_SDK/flipper-z-f7-sdk-$FLIPPER_SDK.zip"
          python3 build_app.py

      # Each toolchain is saved right after its own build succeeds, so a failing
      # firmware build doesn't stop a fresh ufbt cache from being kept.
      - uses: actions/cache/save@v6
        if: env.SAVE_TOOLCHAINS == 'true' && steps.ufbt.outputs.cache-hit != 'true'
        with:
          path: ~/.ufbt
          key: ${{ steps.keys.outputs.ufbt }}

      - name: Build board firmware
        run: pio run -d firmware

      - uses: actions/cache/save@v6
        if: env.SAVE_TOOLCHAINS == 'true' && steps.pio.outputs.cache-hit != 'true'
        with:
          path: ~/.platformio
          key: ${{ steps.keys.outputs.pio }}

      - name: Package
        run: python3 tools/package_release.py -o dist --notes release-notes.md

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.keys.outputs.artifact }}
          path: dist/
          retention-days: 7

      - name: Publish release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --verify-tag --title "Wavehound $GITHUB_REF_NAME" --notes-file release-notes.md
