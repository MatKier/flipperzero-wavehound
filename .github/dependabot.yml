# Open a PR when an action used in .github/workflows has a new release
# (including new major versions, which the @vN tags don't pick up on their own),
# or when ufbt / PlatformIO pinned in .github/ci/requirements.txt has one.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: pip
    directory: /.github/ci
    schedule:
      interval: weekly
